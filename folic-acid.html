        <h1>Importance of Folic Acid</h1>

        <p>
            Folic acid is a B-vitamin essential for cell growth, DNA formation, and brain development.
        </p>

        <p>
            It is especially important in pregnancy to prevent neural tube defects in babies.
        </p>

        <p>
            Sources include spinach, beans, oranges, and fortified grains.
